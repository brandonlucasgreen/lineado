name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks on Linux. They catch most script mistakes and cost nothing
  # next to a macOS runner.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check scripts
        run: scripts/check-shell.sh

  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The runner's default Xcode lags the one this app is developed on, and
      # the gap has already broken the build once: a type that newer SDKs mark
      # Sendable was not Sendable on the runner's, so code that compiled locally
      # failed here. Picking the newest non-beta Xcode on the image narrows that
      # gap, and printing it means the next mismatch is diagnosable from the log.
      - name: Use the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signed ("-"), not unsigned. CI never holds the Developer ID
      # certificate, the notary credentials or the Sparkle key, so it cannot
      # tell you a build is notarizable — that is still a Mac-only check. But
      # an *unsigned* bundle fails the audit below outright, because it has no
      # signature to verify and no entitlements to read. Ad-hoc gives both.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project Lineado.xcodeproj \
            -scheme Lineado -configuration Debug \
            -derivedDataPath build/ci \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            test | xcpretty

      - name: Audit the built bundle
        run: scripts/verify-bundle.sh build/ci/Build/Products/Debug/Lineado.app
