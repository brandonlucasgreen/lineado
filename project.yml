name: Lineado
options:
  bundleIdPrefix: lol.bgreen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  # In-app updates. Sparkle ships as a binary XCFramework, so SPM embeds it and
  # Xcode re-signs it with our Developer ID. That re-signing is the one part
  # notarization cares about and the one part no build failure reveals —
  # scripts/notarize.sh preflights it. (Inbox & Chill, CLAUDE.md §Sparkle.)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact, not `from:`. The signing tools in scripts/sparkle-tools.sh are
    # pinned to the same version, and `from:` let the framework float to
    # 2.10.0 while the tools stayed on 2.9.6. Bump both together.
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Real Developer ID signing, not ad-hoc ("-"), even for local builds.
    # macOS keys Keychain ACLs and TCC decisions to the code signature: an
    # ad-hoc signature has no stable identity, so every rebuild looks like a
    # brand-new app and re-prompts for all of them.
    #
    # Building this yourself? Change DEVELOPMENT_TEAM to your own Team ID, or
    # pass CODE_SIGN_IDENTITY="-" to xcodebuild for an unsigned build.
    DEVELOPMENT_TEAM: CV926C8KS8
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  Lineado:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.lineado
        PRODUCT_NAME: Lineado
        INFOPLIST_FILE: Lineado-Info.plist
        CODE_SIGN_ENTITLEMENTS: Lineado.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The re-sign phase below writes into the built app bundle, which a
        # sandboxed build script is not allowed to do.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          # Xcode injects `get-task-allow` (a debugging entitlement) by
          # default. Notarization rejects a Developer ID binary carrying it.
          # Scoped to Release so a Debug build can still be debugged.
          # Caught by `notarize.sh --preflight-only` before the first release.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # Xcode signs local builds with `--timestamp=none`; notarization
          # requires a secure timestamp. Same preflight caught it.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    postBuildScripts:
      - name: Re-sign Sparkle's nested helpers
        # The embedded framework is declared as this script's INPUT so Xcode
        # orders it after the Embed Frameworks copy. Without it the two raced:
        # an incremental build ran this script while Sparkle.framework was still
        # being copied in, and codesign failed with "bundle format unrecognized,
        # invalid, or unsuitable" (2026-10-21). Clean builds — every release —
        # happened to win the race, which is why it hid. Inbox & Chill's copy of
        # this step declares no input either.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework
        # No outputs to compare, so without this Xcode would warn and might
        # skip it; it must run on every build that re-embeds the framework.
        basedOnDependencyAnalysis: false
        # Ported from Inbox & Chill (its CLAUDE.md, trap 2), which hit this
        # first. Sparkle.framework carries Autoupdate, Updater.app and two
        # XPC services, and Xcode's embed step re-signs only the framework
        # bundle — leaving all four ad-hoc signed, with no team identifier,
        # no hardened runtime and no timestamp. `codesign --verify --deep`
        # still passes, so only notarization (or the preflight) objects.
        #
        # Signed inside-out, because sealing an inner item invalidates every
        # seal around it. Xcode signs the app bundle after this phase, so the
        # outermost seal is still Xcode's.
        script: |
          set -e
          FRAMEWORK="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [ -d "$FRAMEWORK" ] || exit 0

          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          # The timestamp server is a network round trip, so only signed
          # Release builds pay for it.
          if [ "$IDENTITY" = "-" ] || [ "$CONFIGURATION" = "Debug" ]; then
            STAMP="--timestamp=none"
          else
            STAMP="--timestamp"
          fi

          VERSION_DIR="$FRAMEWORK/Versions/Current"
          for NESTED in \
            "$VERSION_DIR/XPCServices/Downloader.xpc" \
            "$VERSION_DIR/XPCServices/Installer.xpc" \
            "$VERSION_DIR/Updater.app" \
            "$VERSION_DIR/Autoupdate" ; do
            [ -e "$NESTED" ] || continue
            codesign --force --options runtime "$STAMP" --sign "$IDENTITY" "$NESTED"
          done
          codesign --force --options runtime "$STAMP" --sign "$IDENTITY" "$FRAMEWORK"
    info:
      path: Lineado-Info.plist
      properties:
        CFBundleName: Lineado
        CFBundleDisplayName: Lineado
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Menu bar app: no Dock icon, no ⌘Tab entry. The ⌘0 window flips this
        # to .regular while it is open (see LineadoApp.swift).
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "MIT licensed. © 2026 Brandon Green."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # ---------------------------------------------------------------
        # Sparkle. These keys are set HERE and not via INFOPLIST_KEY_<name>
        # build settings, because Xcode only synthesises INFOPLIST_KEY_* for
        # keys it already knows and SUFeedURL is not one of them. Inbox & Chill
        # shipped a bundle with no feed URL that way, and nothing warned.
        #
        # The feed is a file in this repo, served raw from `main` — Inbox &
        # Chill's arrangement exactly. No domain, no Pages; scripts/release.sh
        # commits and pushes appcast.xml after each GitHub release.
        #
        # Moving to a custom domain later is possible: ship one update, via
        # this feed, whose Info.plist names the new SUFeedURL, and keep this
        # file serving until existing installs have taken it. (An earlier note
        # here said changing the URL "strands every existing install"; that
        # overstated it.)
        SUFeedURL: https://raw.githubusercontent.com/brandonlucasgreen/lineado/main/appcast.xml
        # Check daily without asking first; Sparkle still asks before
        # installing anything. For early users, an update they never hear
        # about is feedback that never arrives.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: false
        # The public half of Lineado's own EdDSA key (keychain account "lineado",
        # created 2026-10-20 by scripts/sparkle-keys.sh). Public by design. The
        # private half must never change: every installed build trusts only
        # this key, so a new one would strand them all.
        SUPublicEDKey: re/jkuLbS8yIQ3A52kzIYBTToG58SfWYYOtehwOUG3k=

  LineadoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Lineado
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lineado:
    build:
      targets:
        Lineado: all
        LineadoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LineadoTests
